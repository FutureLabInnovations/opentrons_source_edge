name: Sync upstream fork

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-edge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: edge
          fetch-depth: 0

      - name: Fast-forward from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Opentrons/opentrons.git
          git fetch upstream edge
          git checkout edge
          git merge --ff-only upstream/edge
          git push origin edge
